bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  keep_tex: true
  
bookdown::gitbook:
  css: style.css
  split_bib: yes
  # table_css: FALSE
  config:
    toc:
      collapse: section
      before: |
        <li><a href="./">
            Mastering SPC charts
          </a>
        </li>
      after: |
        <li><a href="https://github.com/rstudio/bookdown" target="blank">
            Published with bookdown
          </a>
        </li>

